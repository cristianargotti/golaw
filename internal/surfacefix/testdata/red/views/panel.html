<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Panel</title>
<style>
table { border-collapse: collapse; }
th, td { padding: 4px; }
table { width: 100%; }
</style>
</head>
<body>
<div role="status" id="state"></div>
<table id="rows"></table>
<script>
function render(view) {
  return view.title;
}

function label(count) {
  return count === 0 ? "empty" : count > 9 ? "many" : "some";
}

function classify(rows, limit, strict) {
  let score = 0;
  for (const row of rows) {
    if (row.active) {
      if (row.size > limit) {
        if (strict) {
          score += 3;
        } else if (row.size > limit * 2) {
          score += 2;
        } else {
          score += 1;
        }
      } else if (row.size === 0) {
        for (const tag of row.tags) {
          if (tag === "empty" || tag === "void") {
            score -= 1;
          }
        }
      }
    } else if (row.hidden && !strict) {
      score -= 2;
    }
  }
  return score;
}

function show(state, rows) {
  if (rows.length === 0)
    state.textContent = label(0);
    state.dataset.empty = "true";
  if (rows.length > 100)
    state.textContent = label(rows.length);
    state.dataset.large = "true";
  return classify(rows, 10, false);
}

window.addEventListener("DOMContentLoaded", function () {
  const state = document.getElementById("state");
  show(state, []);
  render({ title: "panel" }, state);
});
</script>
</body>
</html>
