# The proof entries of the policy checks the lint half of the family owns:
# one entry per registered check, with the finding code its red fixture
# must yield and its two fixture directories relative to this file.
checks:
  - {id: policy.golangci, code: golangci-linter-disabled, red: testdata/policy.golangci/red, near: testdata/policy.golangci/near}
  - {id: policy.ruleguard, code: ruleguard-rule-missing, red: testdata/policy.ruleguard/red, near: testdata/policy.ruleguard/near}
  - {id: policy.gitleaks-generic, code: gitleaks-generated-allowlist, red: testdata/policy.gitleaks-generic/red, near: testdata/policy.gitleaks-generic/near}
