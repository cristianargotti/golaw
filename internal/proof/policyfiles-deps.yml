# The proof entries of the policy checks the deps half of the family owns:
# one entry per registered check, with the finding code its red fixture
# must yield and its two fixture directories relative to this file.
checks:
  - id: policy.dependency-records
    code: dependency-record-missing
    red: testdata/policy.dependency-records/red
    near: testdata/policy.dependency-records/near
  - id: policy.dependabot-cooldown
    code: dependabot-cooldown-short
    red: testdata/policy.dependabot-cooldown/red
    near: testdata/policy.dependabot-cooldown/near
  - id: policy.deps-age-config
    code: deps-age-minimum
    red: testdata/policy.deps-age-config/red
    near: testdata/policy.deps-age-config/near
  - id: policy.image-digest
    code: image-digest-missing
    red: testdata/policy.image-digest/red
    near: testdata/policy.image-digest/near
  - id: policy.squawk-config
    code: squawk-policy
    red: testdata/policy.squawk-config/red
    near: testdata/policy.squawk-config/near
  - id: policy.openapi-assertions
    code: openapi-policy
    red: testdata/policy.openapi-assertions/red
    near: testdata/policy.openapi-assertions/near
  - id: policy.codeowners-foreign
    code: foreign-owned-change
    red: testdata/policy.codeowners-foreign/red
    near: testdata/policy.codeowners-foreign/near
    profile: fixture
