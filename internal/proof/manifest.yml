# One entry per registered check: the id, the finding code its red fixture
# must yield, and the two fixture directories relative to this file. The
# proof test walks this list, so a registration and its entry go together.
checks:
  - id: goast.file-length
    code: file-length
    red: testdata/goast.file-length/red
    near: testdata/goast.file-length/near
  - id: goast.function-length
    code: function-length
    red: testdata/goast.function-length/red
    near: testdata/goast.function-length/near
  - id: goast.env-read
    code: env-read
    red: testdata/goast.env-read/red
    near: testdata/goast.env-read/near
  - id: goast.bare-context
    code: bare-context
    red: testdata/goast.bare-context/red
    near: testdata/goast.bare-context/near
  - id: goast.wall-clock
    code: wall-clock
    red: testdata/goast.wall-clock/red
    near: testdata/goast.wall-clock/near
