# One entry per registered check: the id, the finding code its red fixture
# must yield, and the two fixture directories relative to this file. The
# proof test walks this list, so a registration and its entry go together.
checks:
  - id: text.dashes
    code: em-dash
    red: testdata/text.dashes/red
    near: testdata/text.dashes/near
  - id: text.trace-terms
    code: trace-term
    red: testdata/text.trace-terms/red
    near: testdata/text.trace-terms/near
  - id: text.tool-terms
    code: tool-term
    red: testdata/text.tool-terms/red
    near: testdata/text.tool-terms/near
  - id: text.comment-language
    code: comment-language
    red: testdata/text.comment-language/red
    near: testdata/text.comment-language/near
  - id: text.todo
    code: todo-marker
    red: testdata/text.todo/red
    near: testdata/text.todo/near
  - id: text.bare-nolint
    code: bare-nolint
    red: testdata/text.bare-nolint/red
    near: testdata/text.bare-nolint/near
  - id: text.nolint-nilnil
    code: nolint-nilnil
    red: testdata/text.nolint-nilnil/red
    near: testdata/text.nolint-nilnil/near
  - id: text.debug-print
    code: debug-print
    red: testdata/text.debug-print/red
    near: testdata/text.debug-print/near
  - id: paths.forbidden
    code: binary-document
    red: testdata/paths.forbidden/red
    near: testdata/paths.forbidden/near
