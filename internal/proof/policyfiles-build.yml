# The proof entries of the policy checks the build half of the family owns:
# one entry per registered check, with the finding code its red fixture
# must yield and its two fixture directories relative to this file.
checks:
  - id: policy.makefile
    code: make-target-missing
    red: testdata/policy.makefile/red
    near: testdata/policy.makefile/near
  - id: policy.ci-target
    code: ci-target-missing
    red: testdata/policy.ci-target/red
    near: testdata/policy.ci-target/near
  - id: policy.generated-fresh
    code: generate-check-missing
    red: testdata/policy.generated-fresh/red
    near: testdata/policy.generated-fresh/near
