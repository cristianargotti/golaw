# The pinned external linters of the non-Go surface (M6.5.1). A pin enters
# seven days after its publication: published is the upstream date and read
# the day the pins and checksums were read. The sha256 of a binary asset is
# the kit's record; for ruff and hadolint it equals the upstream checksum
# file at pin time, shellcheck and shfmt publish none.
read: "2026-10-27"
runtimes:
  - { name: node, floor: "22.13.0", probe: [--version] }
  - { name: python, floor: "3.10", below: "3.15", probe: [--version] }
tools:
  - name: cfn-lint
    version: "1.58.0"
    published: "2026-10-20"
    distribution: pypi
    languages: [cloudformation]
    probe: [--version]
    bin: cfn-lint
  - name: checkov
