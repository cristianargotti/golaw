# The strict set: every stable ruff rule, minus one rule of each
# incompatible docstring pair and the rules the formatter rewrites anyway,
# so the findings left are the ones a person fixes.
[lint]
select = ["ALL"]
ignore = [
  "COM812",
  "COM819",
  "D203",
  "D206",
  "D213",
  "D300",
  "E111",
  "E114",
  "E117",
  "ISC002",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "Q004",
  "W191",
]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-branches = 12
