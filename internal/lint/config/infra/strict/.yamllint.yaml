# The strict set: yamllint's default rules, run with --strict, in the style
# of the YAML the kit itself writes, so an adopter is never red on files the
# kit rendered: no document start marker, flow maps with one space inside
# the braces, one space before the comment that names a pinned action's
# version, and lines up to 160 columns for an action pinned by its digest.
# An OpenAPI document keeps no line length law, and a key named on or yes
# is a key, not a boolean.
extends: default
rules:
  document-start: disable
  braces:
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
  line-length:
    max: 160
    ignore: |
      **/api/**
  truthy:
    check-keys: false
