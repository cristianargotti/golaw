# The rule map rows of the Python tools (M6.4.3). Each row names the Sonar
# way key, the local rule standing for it, where the tool runs (H the post
# hook on the file just written, L the lint target and CI; the native
# checks carry their own keys), how close the match is and the lowest set
# that enables it. Every row has a proof entry in proof/python.yml.
- {
    sonar: "python:S1523",
    tool: ruff,
    rule: S102,
    where: [H, L],
    match: exact,
    set: parity,
  }
