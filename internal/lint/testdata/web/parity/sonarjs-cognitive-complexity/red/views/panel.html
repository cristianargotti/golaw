<!doctype html>
<html lang="en">
<head><title>Panel</title></head>
<body>
<output id="total"></output>
<script>
  function summarize(rows, filter) {
    let total = 0;
    for (const row of rows) {
      if (row.active) {
        for (const item of row.items) {
          if (item.kind === filter) {
            if (item.value > 0) {
              total += item.value;
            }
          } else if (item.kind === "all") {
            total += 1;
          } else {
            total -= 1;
          }
        }
      } else if (row.pending) {
        total += 1;
      }
    }
    return total;
  }
  document.getElementById("total").textContent = String(summarize([], "all"));
</script>
</body>
</html>
