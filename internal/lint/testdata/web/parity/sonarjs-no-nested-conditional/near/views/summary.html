<!doctype html>
<html lang="en">
<head><title>Summary</title></head>
<body>
<output id="count"></output>
<script>
  function label(count) {
    if (count === 0) {
      return "empty";
    }
    return count > 9 ? "many" : "few";
  }
  document.getElementById("count").textContent = label(3);
</script>
</body>
</html>
