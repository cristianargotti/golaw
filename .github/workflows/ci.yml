# The pull request gate of the kit: make ci on the three operating systems,
# then a refusal of any drift the pipeline left behind. Every action is
# pinned by commit with its version beside it, the token is read only and
# never persisted in the checkout, and the toolchain named in go.mod is
# restored after setup-go pins GOTOOLCHAIN to local.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request cancels its older runs. A push to main runs in a group of
# its own commit, so a newer merge neither cancels it nor replaces it while
# it waits: the release gate requires a successful push run for the tag.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOFLAGS: -mod=readonly

jobs:
  ci:
    name: make ci / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - name: Use the toolchain named in go.mod
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: Install pinned tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/evilmartians/lefthook/v2@v2.1.12
      - name: Check runner build tools
        run: make --version
      - name: Run the pipeline
        run: make ci
      - name: Reject formatting and module drift
        run: git diff --exit-code
  acceptance:
    name: acceptance / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      DISABLE_AUTOUPDATER: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - name: Use the toolchain named in go.mod
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Install the pinned host
        run: npm install --global @anthropic-ai/claude-code@2.1.299
      - name: Replay the installed invocation
        run: go run ./tools/acceptance

  m2:
    name: M2 acceptance / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - name: Use the toolchain named in go.mod
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: Replay M2 rows
        run: go run ./tools/acceptance -m2
      - name: Measure native rungs
        env:
          GOLAW_M2_MEASURE: '1'
        run: go test -race -timeout=45m -run '^TestM2Measurements$' -count=1 -v ./tools/acceptance/

  m3:
    name: M3 acceptance / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - name: Use the toolchain named in go.mod
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Replay M3 rows
        run: go run ./tools/acceptance -m3

  m4:
    name: M4 acceptance / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - name: Use the toolchain named in go.mod
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Install the pinned Codex CLI
        run: npm install --global @openai/codex@0.163.0
      - name: Replay M4 rows
        run: go run ./tools/acceptance -m4

  m5:
    name: M5 acceptance / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - name: Use the toolchain named in go.mod
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: Replay M5 rows
        run: go run ./tools/acceptance -m5

  release-config:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - name: Restore automatic toolchain selection
        shell: bash
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: Download modules
        run: go mod download
      - name: Verify pins and release decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: go test -tags=network,releaseprobe ./tools/cicheck
      - name: Validate CI syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate release configuration
        run: go run github.com/goreleaser/goreleaser/v2@v2.12.7 check

  claude-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      DISABLE_AUTOUPDATER: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Install pinned host
        run: npm install --global @anthropic-ai/claude-code@2.1.299
      - name: Validate plugin
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/golaw-plugin
        run: claude plugin validate --strict agents/claude
