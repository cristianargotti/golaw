name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'cristianargotti/golaw'
    runs-on: ubuntu-latest
    # The release rows of M1 to M7 run in one job; with M7 they passed 30
    # minutes, so the gate takes the 60 the acceptance jobs of ci.yml take.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      DISABLE_AUTOUPDATER: '1'
    outputs:
      sha: ${{ steps.eligible.outputs.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - name: Restore automatic toolchain selection
        shell: bash
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - id: eligible
        name: Require successful CI for the tag commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/cicheck/release-gate.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Install the pinned host
        run: npm install --global @anthropic-ai/claude-code@2.1.299
      - name: Install the pinned Codex CLI
        run: npm install --global @openai/codex@0.163.0
      # The M7 rows run make ci of a generated repository, so the gate
      # carries the tools the generated pipeline installs.
      - name: Install the pinned tools of the generated pipeline
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install -ldflags=-X=github.com/zricethezav/gitleaks/v8/version.Version=v8.30.1 github.com/zricethezav/gitleaks/v8@v8.30.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Install the contract linter
        run: npm install --global @redocly/cli@2.5.0
      - name: Install the migration linter
        run: npm install --global squawk-cli@2.35.0
      - id: acceptance
        name: Require the release rows and the dated live record
        run: go run ./tools/acceptance -release

  release:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - id: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - name: Restore automatic toolchain selection
        shell: bash
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: Scan the immutable candidate
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{commit}')" = "$RELEASE_SHA"
          test "$(git rev-parse "${GITHUB_REF}^{commit}")" = "$RELEASE_SHA"
          go build -trimpath -o "$RUNNER_TEMP/golaw-candidate" ./cmd/golaw
          "$RUNNER_TEMP/golaw-candidate" scan .
          git diff --exit-code
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.33.0
      - id: draft
        name: Prepare signed draft
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.12.7
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: verify
        name: Verify the exact signing identity
        shell: bash
        run: |
          cosign verify-blob \
            --new-bundle-format \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity \
            "https://github.com/cristianargotti/golaw/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer \
            https://token.actions.githubusercontent.com \
            dist/checksums.txt
      - id: attest
        name: Attest every binary
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/golaw_*/*.exe
            dist/golaw_*/golaw_*_darwin-*
            dist/golaw_*/golaw_*_linux-*
      - id: publish
        name: Publish verified draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
