# The scheduled vulnerability lane, apart from the pull request gate because
# the database is live: an advisory published overnight must not turn an
# unrelated pull request red. Exception path: a reachable advisory is fixed
# by a toolchain or dependency bump; when no fix exists yet, a dated waiver
# in vulnerability_waivers of golaw.yml, with its decision record under
# docs/adr/, keeps the lane green until the day it names and never longer
# (tools/vulngate prints every waiver it applies and fails on an expired
# one).
name: Vulnerabilities

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - name: Use the toolchain named in go.mod
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Scan with the waivers of golaw.yml
        run: make vuln

  m2-live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - name: Use the toolchain named in go.mod
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: Time the rungs against the live database
        env:
          GOLAW_M2_MEASURE: '1'
          GOLAW_M2_LIVE_DB: '1'
        run: go test -race -timeout=45m -run '^TestM2Measurements$' -count=1 -v ./tools/acceptance/
