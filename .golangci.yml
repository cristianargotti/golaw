# golangci-lint v2 configuration: the strict set of the standard adapted to
# a command line tool with no database and no HTTP service. Depguard draws
# the package boundaries of section 5.1 of the design instead of hexagonal
# layers. Lists of names are written in flow style so the file keeps to the
# 300 line law.
version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    [asasalint, bidichk, bodyclose, canonicalheader, containedctx, contextcheck, copyloopvar,
     depguard, dupl, dupword, durationcheck, err113, embeddedstructfieldcheck, errchkjson,
     errname, errorlint, exhaustive, exptostd, fatcontext, forbidigo, forcetypeassert,
     funcorder, funlen, gocheckcompilerdirectives, gochecknoglobals, gochecknoinits,
     gochecksumtype, gocognit, goconst, gocritic, godoclint, godot, godox, gomoddirectives,
     goprintffuncname, gosec, gosmopolitan, iface, inamedparam, interfacebloat, intrange,
     maintidx, makezero, mirror, misspell, mnd, modernize, musttag, nakedret, nestif, nilerr,
     nilnesserr, nilnil, noctx, nolintlint, nonamedreturns, nosprintfhostport, paralleltest,
     perfsprint, prealloc, predeclared, reassign, recvcheck, revive, sloglint,
     testableexamples, testpackage, thelper, tparallel, unconvert, unparam, usestdlibvars,
     usetesting, wastedassign, whitespace, wrapcheck]
  settings:
    wrapcheck:
      # Every error that crosses a package boundary carries the package and
      # the action it failed at, so a hook reason names the layer without a
      # stack trace; %w keeps errors.Is working on the sentinels underneath.
      ignore-sigs: [.Errorf(, errors.New(, errors.Unwrap(, errors.Join(, context.Context).Err(]
    depguard:
      # The package direction of section 5.1: model imports nothing internal,
      # engine imports model, the check families import model, the policy
      # family also reads YAML, go.mod and TOML, and the catalog composes them.
      rules:
        model:
          list-mode: strict
          files: ["!$test", "**/internal/model/**"]
          allow: [$gostd]
        engine:
          list-mode: strict
          files: ["!$test", "**/internal/engine/**"]
          allow: [$gostd, github.com/cristianargotti/golaw/internal/model]
        source:
          list-mode: strict
          files: ["!$test", "**/internal/source/**"]
          allow: [$gostd, github.com/cristianargotti/golaw/internal/model]
        families:
          list-mode: strict
          files: ["!$test", "**/internal/checks/**", "!**/internal/checks/catalog.go", "!**/internal/checks/policyfiles/**"]
          allow: [$gostd, github.com/cristianargotti/golaw/internal/model]
        policyfiles:
          list-mode: strict
          files: ["!$test", "**/internal/checks/policyfiles/**"]
          allow: [$gostd, github.com/cristianargotti/golaw/internal/model, gopkg.in/yaml.v3, golang.org/x/mod, github.com/BurntSushi/toml]
        catalog:
          list-mode: strict
          files: ["!$test", "**/internal/checks/catalog.go"]
          allow:
            - $gostd
            - github.com/cristianargotti/golaw/internal/model
            - github.com/cristianargotti/golaw/internal/engine
            - github.com/cristianargotti/golaw/internal/checks
        policy:
          list-mode: strict
          files: ["!$test", "**/internal/policy/**"]
          allow: [$gostd, github.com/cristianargotti/golaw/internal/model, gopkg.in/yaml.v3]
        proof:
          list-mode: strict
          files: ["!$test", "**/internal/proof/**"]
          allow:
            - $gostd
            - github.com/cristianargotti/golaw/internal/model
            - github.com/cristianargotti/golaw/internal/engine
            - gopkg.in/yaml.v3
        # The rungs: runner, coverage and vuln speak model alone, the staged scan, a rung
        # and setup compose the layers below them, and the two test helpers use the stdlib.
        runner:
          list-mode: strict
          files: ["!$test", "**/internal/runner/**"]
          allow: [$gostd, github.com/cristianargotti/golaw/internal/model]
        coverage:
          list-mode: strict
          files: ["!$test", "**/internal/coverage/**"]
          allow: [$gostd, github.com/cristianargotti/golaw/internal/model]
        vuln:
          list-mode: strict
          files: ["!$test", "**/internal/vuln/**"]
          allow: [$gostd, github.com/cristianargotti/golaw/internal/model]
        stage:
          list-mode: strict
          files: ["!$test", "**/internal/stage/**"]
          allow: [$gostd, github.com/cristianargotti/golaw/internal/model, github.com/cristianargotti/golaw/internal/engine, github.com/cristianargotti/golaw/internal/source, github.com/cristianargotti/golaw/internal/policy, github.com/cristianargotti/golaw/internal/report]
        rung:
          list-mode: strict
          files: ["!$test", "**/internal/rung/**"]
          allow: [$gostd, github.com/cristianargotti/golaw/internal/model, github.com/cristianargotti/golaw/internal/engine, github.com/cristianargotti/golaw/internal/policy, github.com/cristianargotti/golaw/internal/source, github.com/cristianargotti/golaw/internal/stage, github.com/cristianargotti/golaw/internal/runner, github.com/cristianargotti/golaw/internal/report, github.com/cristianargotti/golaw/internal/vuln]
        setup:
          list-mode: strict
          files: ["!$test", "**/internal/setup/**"]
          allow: [$gostd, github.com/cristianargotti/golaw/internal/model, github.com/cristianargotti/golaw/internal/runner, github.com/cristianargotti/golaw/internal/install]
        gittest:
          list-mode: strict
          files: ["!$test", "**/internal/gittest/**"]
          allow: [$gostd]
        runnertest:
          list-mode: strict
          files: ["!$test", "**/internal/runnertest/**"]
          allow: [$gostd]
        # The profile bundle and the release verification of M5: the loader reads
        # YAML beside model and policy and clones through runner, its test support
        # reaches the loader and gittest, and the verifier is standard cryptography.
        profile:
          list-mode: strict
          files: ["!$test", "**/internal/profile/**"]
          allow: [$gostd, github.com/cristianargotti/golaw/internal/model, github.com/cristianargotti/golaw/internal/policy, github.com/cristianargotti/golaw/internal/runner, gopkg.in/yaml.v3]
        profiletest:
          list-mode: strict
          files: ["!$test", "**/internal/profiletest/**"]
          allow: [$gostd, github.com/cristianargotti/golaw/internal/model, github.com/cristianargotti/golaw/internal/policy, github.com/cristianargotti/golaw/internal/profile, github.com/cristianargotti/golaw/internal/gittest]
        release:
          list-mode: strict
          files: ["!$test", "**/internal/release/**"]
          allow: [$gostd]
        cmd:
          list-mode: strict
          files: ["**/cmd/**"]
          allow: [$gostd, github.com/cristianargotti/golaw, github.com/spf13/cobra, github.com/spf13/pflag]
        main:
          list-mode: lax
          deny:
            - pkg: io/ioutil
              desc: deprecated since Go 1.16, use io and os
            - pkg: github.com/pkg/errors
              desc: use fmt.Errorf with %w and the standard errors package
            - pkg: math/rand$
              desc: use math/rand/v2 or crypto/rand
            - pkg: github.com/sirupsen/logrus
              desc: log/slog is the logger of this tool
    godot:
      scope: toplevel
      capital: false
    iface:
      enable: [identical, unused, opaque]
    paralleltest:
      # t.Setenv, t.Chdir and shared fixtures are the only reasons a test is serial.
      ignore-missing: false
    usetesting:
      context-background: true
      context-todo: true
      os-setenv: true
      os-temp-dir: true
    testpackage:
      # White-box tests live in *_internal_test.go; everything else is black box.
      skip-regexp: (export|internal)_test\.go
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions: [(io.Closer).Close, (io.ReadCloser).Close, (io/fs.File).Close, (*os.File).Close]
    gosec:
      # G104 repeats errcheck, which keeps the unchecked error.
      excludes: [G104]
    dupl:
      threshold: 80
    goconst:
      min-len: 3
      min-occurrences: 3
      ignore-calls: false
      ignore-string-values:
        - '^(%[a-z]|[\s:,()])+$'
    mnd:
      ignored-numbers: ["0", "1", "2", "10", "100", "1000", "1024"]
    nestif:
      min-complexity: 4
    nakedret:
      max-func-lines: 0
    funlen:
      # Function size law: 40 lines and 40 statements, comments excluded.
      lines: 40
      statements: 40
      ignore-comments: true
    gocognit:
      min-complexity: 15
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    forbidigo:
      # Time enters as a parameter or through a clock function so every
      # package is testable at its boundary; cmd and the tests read the clock.
      forbid:
        - pattern: ^float32$
          msg: a float32 loses precision the standard forbids; use float64
        - pattern: ^time\.Now$
          msg: time enters as a parameter or a clock function (cmd reads the clock)
        - pattern: ^time\.Since$
          msg: time enters as a parameter or a clock function (cmd reads the clock)
        - pattern: ^time\.Until$
          msg: time enters as a parameter or a clock function (cmd reads the clock)
      analyze-types: true
    gosmopolitan:
      allow-time-local: false
    gocritic:
      enabled-tags: [diagnostic, style, performance]
      # deferInLoop repeats the defer rule of revive, which keeps the defect.
      disabled-checks: [hugeParam, unnamedResult, deferInLoop]
      settings:
        # The ruleguard rules of the standard (scripts/lint/rules.go); the
        # ruleguard check itself comes with the style tag.
        ruleguard:
          rules: '${base-path}/scripts/lint/rules.go'
          failOn: all
    govet:
      enable-all: true
      disable: [fieldalignment]
    misspell:
      locale: US
      # Comments only: the human channel strings are in the configured language.
      mode: restricted
    revive:
      # The 24 base rules and the 16 bug-class rules of inventory 4.5, then
      # the file and function laws of section 3.
      rules:
        [{name: blank-imports}, {name: context-as-argument}, {name: context-keys-type}, {name: dot-imports},
         {name: error-return}, {name: error-strings}, {name: error-naming}, {name: exported},
         {name: if-return}, {name: increment-decrement}, {name: var-naming}, {name: var-declaration},
         {name: package-comments}, {name: range}, {name: receiver-naming}, {name: time-naming},
         {name: unexported-return}, {name: indent-error-flow}, {name: errorf}, {name: empty-block},
         {name: superfluous-else}, {name: unused-parameter}, {name: unreachable-code}, {name: redefines-builtin-id},
         {name: defer}, {name: datarace}, {name: atomic}, {name: waitgroup-by-value},
         {name: time-equal}, {name: identical-branches}, {name: unconditional-recursion}, {name: modifies-value-receiver},
         {name: deep-exit}, {name: import-shadowing}, {name: struct-tag}, {name: unhandled-error},
         {name: range-val-address}, {name: string-of-int}, {name: use-errors-new}, {name: redundant-build-tag},
         {name: file-length-limit, arguments: [{max: 300, skipComments: false, skipBlankLines: false}]},
         {name: function-length, arguments: [0, 40]}]
    sloglint:
      no-mixed-args: true
      attr-only: true
      static-msg: true
      context: scope
      key-naming-case: snake
    staticcheck:
      # ST1000 and ST1003 repeat package-comments and var-naming of revive, which keep those defects.
      checks: [all, -ST1000, -ST1003]
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - bodyclose
          # Table-driven tests are one function by design; the file limit still applies.
          - funlen
          # Fixtures and expected values are literals by nature.
          - mnd
          - goconst
          - dupl
          - gochecknoglobals
          - musttag
      # Section 3: a test file keeps the file limit and loses the function
      # limit, which revive's function-length holds beside funlen.
      - path: _test\.go
        text: function-length
        linters: [revive]
      # The model declares the interfaces every other package implements or
      # consumes; by design nothing inside the model uses them.
      - path: internal/model/
        linters: [iface]
      # The clock belongs to the edges: cmd and the tests read it.
      - path: (^cmd/|_test\.go)
        text: time enters as a parameter
        linters: [forbidigo]

formatters:
  enable: [gofumpt, gci]
  settings:
    gci:
      sections: [standard, default, prefix(github.com/cristianargotti/golaw)]
    gofumpt:
      module-path: github.com/cristianargotti/golaw
      extra:
        group-params: true

issues:
  # A fixed line shows its next defect in the same run, not the next.
  uniq-by-line: false
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
      colors: false
  show-stats: true
