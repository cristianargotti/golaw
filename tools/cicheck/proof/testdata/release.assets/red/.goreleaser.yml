version: 2
project_name: golaw

builds:
  - id: golaw
    main: ./cmd/golaw
    binary: 'golaw_{{ .Version }}_{{ .Os }}-{{ .Arch }}'
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: binaries
    ids: [golaw]
    formats: [binary]
    name_template: 'golaw_{{ .Version }}_{{ .Os }}-{{ .Arch }}'

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: binaries
    artifacts: archive
    ids: [binaries]
    documents: ['golaw_{{ .Version }}_{{ .Os }}-{{ .Arch }}.sbom.spdx.json']
    cmd: syft
    args: ['${artifact}', --output, 'spdx-json=${document}']

signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: '${artifact}.sigstore.json'
    args: [sign-blob, --new-bundle-format, '--bundle=${signature}', --yes, '${artifact}']

changelog:
  use: git
  sort: asc

release:
  draft: true
  prerelease: auto
  target_commitish: '{{ .Commit }}'
